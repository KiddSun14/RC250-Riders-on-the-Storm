
name: RC250 STORM V05 - APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: RC250_STORM_V05_GITHUB

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar tablero STORM
        run: |
          test -f app/src/main/assets/dashboard.jpg
          test -f app/src/main/assets/index.html
          grep -q 'stormv5' app/build.gradle.kts

      - name: Compilar RC250 STORM V05
        run: gradle :app:assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RC250-STORM-V05-APK
          path: RC250_STORM_V05_GITHUB/app/build/outputs/apk/debug/app-debug.apk
