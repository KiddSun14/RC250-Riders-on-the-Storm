<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#08090b" />
<title>AutoStrom</title>
<style>
:root{color-scheme:dark;--accent:#ff721c;--orange:#ff8f35;--paper:#f2f2f2;--muted:#b4b1b6;--border:#35363b;--surface:#131416;--back:#060709}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#060608;color:var(--paper);font-family:Inter,'Arial',system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{height:100dvh;display:flex;flex-direction:column;min-width:620px;background:radial-gradient(ellipse at 90% 100%,#34140855 0%,transparent 38%),linear-gradient(135deg,#0b0c10,#050507 68%)}header{height:12%;min-height:57px;padding:1.2vh 2.7vw 1vh;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.clock{font-size:clamp(26px,3.15vw,46px);line-height:1.04;font-weight:750;letter-spacing:-1.2px}.date{font-size:clamp(10px,1vw,14px);color:#b5b5b7;margin-top:4px}.topStatus{display:flex;align-items:center;gap:14px;color:#e4e4e4;font-size:clamp(11px,1.4vw,20px)}.tinyDot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}.batteryShape{display:inline-flex;align-items:center;border:2px solid #e0e0e0;border-radius:4px;width:30px;height:15px;padding:2px;position:relative}.batteryShape:after{content:"";height:7px;width:3px;position:absolute;right:-6px;border-radius:0 2px 2px 0;background:#ddd}.batteryFill{height:100%;width:0;background:#eee;border-radius:1px}.body{display:flex;flex:1;min-height:0;padding:0 1.3vw 1.4vh 1vw;gap:1.4vw}.sidebar{width:clamp(65px,8.2%,110px);flex-shrink:0;border:1px solid #29292c;border-radius:24px;background:linear-gradient(165deg,#09090beb,#101011e8);display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:8px 3px;box-shadow:0 9px 35px #0008}.navbtn{width:75%;aspect-ratio:1;border:2px solid transparent;background:none;border-radius:20px;color:#dcdfe4;display:grid;place-items:center}.navbtn svg{width:57%;height:57%;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}.navbtn.selected{color:white;border-color:var(--accent);box-shadow:0 0 17px #ff6b194a,inset 0 0 16px #ff6b1924}.workspace{flex:1;display:grid;grid-template-columns:40% minmax(0,1fr);min-width:0;gap:1.4vw}.card{border:1px solid #343438;background:linear-gradient(155deg,#18191cde,#08090ae8 68%);border-radius:25px;box-shadow:inset 0 1px 0 #ffffff12,0 10px 25px #0007;min-width:0;overflow:hidden}.mapPanel{position:relative;background:#161719}.mapPanel #mapCanvas{width:100%;height:100%;display:block;background:linear-gradient(34deg,#171a20,#090b11)}.mapGlow{position:absolute;inset:0;box-shadow:inset 0 -100px 70px -75px #08090aff;pointer-events:none}.routeBanner{position:absolute;top:2.5%;left:3%;right:3%;min-height:70px;display:flex;gap:18px;align-items:center;border:1px solid #343639;border-radius:21px;background:linear-gradient(145deg,#202125f2,#141519f5);padding:14px 18px;z-index:2;box-shadow:0 8px 20px #0008}.turnIcon{flex-shrink:0;width:48px;height:48px;display:grid;place-items:center}.turnIcon svg{width:42px;height:42px;stroke:white;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.turnText{min-width:0}.turnText h2{font-size:clamp(17px,2.3vw,35px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;margin:0}.turnText p{font-size:clamp(11px,1.4vw,21px);margin:8px 0 0;color:#bdc0c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mapFooter{position:absolute;bottom:3%;left:3%;right:3%;display:flex;align-items:end;justify-content:space-between;gap:9px;pointer-events:none}.mapFooter>*{pointer-events:auto}.mapPill{font-size:clamp(10px,1.1vw,15px);background:#101114ee;border:1px solid #444;padding:9px 12px;border-radius:12px}.mapPill b{color:var(--accent)}.osmCredit{font-size:9px;color:#d9dee5;background:#111b;padding:3px 5px;border-radius:5px}.right{display:flex;flex-direction:column;min-width:0;gap:1.35vw}.topActions{display:flex;gap:1.4vw;height:24%;min-height:68px}.topActions button{flex:1;display:flex;align-items:center;justify-content:center;gap:15px;border:1px solid #353639;border-radius:23px;background:linear-gradient(150deg,#1e2024,#0c0d11);font-size:clamp(14px,1.9vw,27px)}.topActions button:active,.controls button:active{box-shadow:inset 0 0 18px #ff721c33}.topActions svg{width:clamp(29px,4.4vw,56px);height:clamp(29px,4.4vw,56px);stroke:white;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.underline{height:3px;width:40px;margin:9px auto 0;border-radius:4px;background:var(--accent)}.music{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(12px,2vw,26px);min-height:0}.mediaTop{display:flex;gap:clamp(13px,1.75vw,28px);min-height:0;flex:1}.art{flex-shrink:0;width:clamp(94px,18vw,245px);aspect-ratio:1;max-height:100%;border-radius:16px;border:1px solid #53565a;background:linear-gradient(135deg,#19191b,#010101);box-shadow:0 8px 26px #0008;display:grid;place-items:center;overflow:hidden;color:#858080;font-size:48px}.art img{width:100%;height:100%;object-fit:cover;display:none}.musicInfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:0 1px}.track{font-size:clamp(18px,2.15vw,32px);font-weight:750;line-height:1.16;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:clamp(13px,1.65vw,23px);color:#aba8ac;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.progress{width:100%;height:8px;border-radius:20px;background:#56443e;display:block;cursor:pointer;appearance:none;overflow:hidden;margin:10px 0 4px}.progress::-webkit-slider-thumb{appearance:none;width:0;height:8px;background:var(--accent);box-shadow:-400px 0 0 400px var(--accent)}.durations{display:flex;justify-content:space-between;color:#b9b7b8;font-size:clamp(10px,1.3vw,20px);margin-top:5px;font-variant-numeric:tabular-nums}.mediaControls{display:flex;align-items:center;justify-content:space-evenly;gap:8px;padding-top:clamp(6px,1vw,13px)}.controlsBtn{width:clamp(40px,5.4vw,75px);height:clamp(38px,5vw,68px);border:1px solid #292a2f;background:#16171a;border-radius:18px;color:#ececec;font-size:clamp(21px,2.4vw,35px)}.controlsBtn.primary{border:2px solid var(--accent);box-shadow:0 0 18px #ff721c55;color:white;background:#23150e}.note{font-size:clamp(9px,1vw,12px);color:#a19fa3;text-align:center;padding-top:6px}.branding{height:11%;display:flex;align-items:center;justify-content:space-between;padding:0 2vw 0 .6vw}.brand{font-size:clamp(24px,3vw,46px);font-weight:950;letter-spacing:-1px;font-style:italic}.brand strong{color:var(--accent)}.brandTag{color:#929095;font-size:clamp(10px,1.1vw,15px);text-transform:uppercase;letter-spacing:2px}.overlay{display:none;position:absolute;z-index:9;inset:12% 2% 2% 10.6%;border:1px solid #4a4340;border-radius:24px;background:linear-gradient(145deg,#14161bf5,#090a0cf9);padding:3vh 3vw;box-shadow:0 15px 70px #000c;overflow:auto}.overlay.visible{display:block}.overlayHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.overlayTitle{font-size:clamp(20px,2.5vw,34px);font-weight:750}.textButton{border:1px solid #49494b;background:#191b1e;padding:12px 17px;border-radius:14px}.accentButton{border:1px solid #ff721c;background:linear-gradient(120deg,#a6440d,#ee6015);font-weight:bold;padding:12px 17px;border-radius:14px;color:#fff}.formRow{display:flex;gap:10px;flex-wrap:wrap}.destinationInput{flex:1;min-width:170px;border:1px solid #58595c;background:#101114;color:white;padding:15px;border-radius:15px;font-size:19px}.help{color:#b6b6ba;font-size:14px;line-height:1.6}.routeSummary{display:flex;gap:14px;margin:20px 0;flex-wrap:wrap}.routeSummary b{color:#ff8e49;font-size:22px}.routeSummary span{background:#242529;padding:14px 18px;border:1px solid #454548;border-radius:13px}.appsGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.appTile{border:1px solid #444448;background:#1c1d20;border-radius:16px;padding:12px 3px;color:white;min-height:90px;display:flex;align-items:center;justify-content:center;gap:8px;flex-direction:column}.appTile img{width:42px;height:42px;object-fit:contain}.appTile span{max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.stateMsg{font-size:13px;color:#a4a7ad;margin:10px 0}.error{color:#ffb388}.settingRow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.footNote{position:absolute;right:14px;bottom:8px;font-size:10px;color:#777}@media(max-height:410px){.routeBanner{padding:8px 11px;min-height:52px}.turnIcon,.turnIcon svg{width:30px;height:30px}.music{padding:10px 16px}.art{width:clamp(90px,16vw,175px)}.branding{height:8%}.topActions{height:22%}.overlay{padding:18px}}@media(max-width:820px){.topStatus{gap:8px}.musicInfo{justify-content:center;gap:5px}.music{gap:1px}.art{width:120px}.note{display:none}}
</style>
</head>
<body><div class="app">
<header><div><div class="clock" id="clock">--:--</div><div class="date" id="date">AutoStrom</div></div><div class="topStatus"><span class="tinyDot" id="onlineDot" title="Datos"></span><span id="conn">RED</span><span id="gpsState">GPS •</span><span id="batteryText">--%</span><span class="batteryShape"><span class="batteryFill" id="batteryFill"></span></span></div></header>
<div class="body"><nav class="sidebar" aria-label="Navegación de AutoStrom">
<button class="navbtn selected" data-nav="home" onclick="openPanel('home')" title="Inicio"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-7H9v7H3z"/></svg></button>
<button class="navbtn" data-nav="route" onclick="openPanel('route')" title="Rutas"><svg viewBox="0 0 24 24"><path d="m3 11 18-9-7 19-3-8z"/></svg></button>
<button class="navbtn" data-nav="music" onclick="openPanel('music')" title="Música"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-3v13"/><ellipse cx="6" cy="19" rx="3" ry="2"/><ellipse cx="18" cy="16" rx="3" ry="2"/></svg></button>
<button class="navbtn" onclick="nativeAction('phone')" title="Teléfono"><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-3 2c1.6 3.3 3.3 5 6.8 6.6l2.1-3.2 5.1 2v4c-10 5-23-9-17-17z"/></svg></button>
<button class="navbtn" data-nav="apps" onclick="openPanel('apps')" title="Aplicaciones"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
</nav>
<main class="workspace"><section class="card mapPanel"><canvas id="mapCanvas" role="img" aria-label="Mapa de OpenStreetMap y ruta GPS"></canvas><div class="mapGlow"></div>
<div class="routeBanner"><span class="turnIcon"><svg viewBox="0 0 64 64"><path d="M13 54V30q0-15 16-15h19m-10-10 10 10-10 10"/></svg></span><div class="turnText"><h2 id="maneuver">Listo para conducir</h2><p id="road">Elige un destino en «Ir a»</p></div></div>
<div class="mapFooter"><div class="mapPill"><b id="speed">-- km/h</b><span id="locationHint"> · Esperando GPS</span></div><span class="osmCredit">© OpenStreetMap contributors</span></div>
</section><div class="right"><div class="topActions"><button onclick="openPanel('route')"><svg viewBox="0 0 24 24"><path d="m3 11 18-9-7 19-3-8z"/></svg><div>Ir a<div class="underline"></div></div></button><button onclick="speakNext()"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg><div>Voz<div class="underline"></div></div></button></div>
<section class="card music"><div class="mediaTop"><div class="art" id="artBox"><span id="artFallback">♫</span><img id="albumArt" alt="Carátula de la canción"/></div><div class="musicInfo"><div class="track" id="title">Sin reproducción</div><div class="artist" id="artist">Inicia una canción</div><div><input id="progress" class="progress" type="range" value="0" min="0" max="100" step="1" aria-label="Progreso de canción" onchange="seekSong(this.value)"><div class="durations"><span id="position">0:00</span><span id="duration">0:00</span></div></div></div></div>
<div class="mediaControls"><button class="controlsBtn" onclick="nativeAction('previous')" aria-label="Anterior">⏮</button><button class="controlsBtn primary" id="playButton" onclick="nativeAction('toggle')" aria-label="Reproducir o pausar">▶</button><button class="controlsBtn" onclick="nativeAction('next')" aria-label="Siguiente">⏭</button></div><div class="note" id="musicHint">Música conectada a sesiones multimedia de Android</div></section>
<div class="branding"><span class="brandTag">CONDUCE · ESCUCHA · EXPLORA</span><span class="brand">AutoStrom<strong>///</strong></span></div></div></main></div>
<section id="overlay" class="overlay" role="dialog" aria-label="Panel de AutoStrom"><div class="overlayHead"><div class="overlayTitle" id="overlayTitle">AutoStrom</div><button class="textButton" onclick="openPanel('home')">✕ Cerrar</button></div><div id="overlayBody"></div></section>
</div>
<script>
'use strict';
const state={location:null,route:null,apps:[],media:{duration:0,position:0,playing:false},routeStep:0,voice:false,online:false};
const $=id=>document.getElementById(id);
function nativeAction(name){try{window.Native?.action(name)}catch(e){message('No hay conexión con Android')}}
function nativeOpenApp(pkg){try{window.Native?.openApp(pkg)}catch(e){message('No se pudo abrir la aplicación')}}
function message(s){$('musicHint').textContent=s;}
function timeFmt(ms){const s=Math.floor(Math.max(0,Number(ms)||0)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function clock(){const n=new Date();$('clock').textContent=n.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:true}).replace(/\s*(a|p)\.\s*m\./i,'');$('date').textContent=n.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});}clock();setInterval(clock,12000);
const panelControls={
 route:`<p class="help">Escribe una dirección o lugar. Planea la ruta mientras estés detenido. Las indicaciones completas con recálculo se pueden abrir en Google Maps.</p><div class="formRow"><input id="destination" class="destinationInput" placeholder="¿A dónde vamos?" value="" aria-label="Destino"><button class="accentButton" onclick="calculateRoute()">Calcular ruta</button><button class="textButton" onclick="startNav()">Iniciar navegación ↗</button></div><div class="routeSummary" id="routeSummary"><span id="routeStatus">Sin destino seleccionado</span></div><p class="help">La ruta visible utiliza OpenStreetMap y un servicio público de demostración. Para publicar en Play Store será necesario contratar/configurar un proveedor de navegación de producción.</p>`,
 settings:`<p class="help">Activa el permiso multimedia para mostrar carátula, artista, duración y controlar otras aplicaciones.</p><div class="settingRow"><button class="accentButton" onclick="nativeAction('mediaPermission')">Activar acceso a música</button><button class="textButton" onclick="nativeAction('homeSettings')">Usar AutoStrom como inicio</button><button class="textButton" onclick="nativeAction('settings')">Ajustes del teléfono</button></div><p class="help">Sin anuncios ni envío de historial de música. El cálculo de rutas online comparte ubicación y destino con el proveedor externo.</p>`,
 music:`<p class="help">Los controles funcionan con aplicaciones que publiquen sesiones multimedia compatibles en Android.</p><div class="settingRow"><button class="accentButton" onclick="nativeAction('mediaPermission')">Dar acceso multimedia</button><button class="textButton" onclick="nativeAction('toggle')">Reproducir / pausar</button></div><p class="help">Regresa a Inicio para ver carátula, progreso, duración y controles.</p>`
};
function openPanel(kind){document.querySelectorAll('.navbtn').forEach(el=>el.classList.toggle('selected',el.dataset.nav===kind));if(kind==='home'){$('overlay').classList.remove('visible');return}if(kind==='music'){kind='music';}if(kind==='apps'){nativeAction('apps');renderApps();return}if(kind==='route'){$('overlayTitle').textContent='Navegación';$('overlayBody').innerHTML=panelControls.route;const dest=localStorageSafe('autostromDestination');if(dest)$('destination').value=dest;updateRouteSummary();}else{$('overlayTitle').textContent=kind==='settings'?'Configuración':'Música';$('overlayBody').innerHTML=panelControls[kind]||panelControls.settings;}$('overlay').classList.add('visible');}
function localStorageSafe(k,v){try{if(v!==undefined)localStorage.setItem(k,v);return localStorage.getItem(k)||''}catch(e){return ''}}
function renderApps(){ $('overlayTitle').textContent='Mis aplicaciones';const grid=document.createElement('div');grid.className='appsGrid';state.apps.forEach(a=>{const b=document.createElement('button');b.className='appTile';if(a.icon){const icon=document.createElement('img');icon.src=a.icon;icon.alt='';b.appendChild(icon)}const label=document.createElement('span');label.textContent=a.name;b.appendChild(label);b.onclick=()=>nativeOpenApp(a.pkg);grid.appendChild(b)});$('overlayBody').replaceChildren(grid);if(!state.apps.length){let p=document.createElement('p');p.className='help';p.textContent='Cargando aplicaciones…';$('overlayBody').appendChild(p)}let s=document.createElement('div');s.className='settingRow';let btn=document.createElement('button');btn.className='textButton';btn.textContent='⚙ Configuración';btn.onclick=()=>openPanel('settings');s.appendChild(btn);$('overlayBody').appendChild(s);$('overlay').classList.add('visible');}
function calculateRoute(){const v=$('destination')?.value.trim();if(!v){alert('Escribe un destino');return}localStorageSafe('autostromDestination',v);$('routeStatus').textContent='Buscando ruta real…';if(window.Native)window.Native.routeTo(v);else message('La navegación real necesita la app Android')}
function startNav(){const s=$('destination')?.value.trim()||state.route?.destination||'';if(!s){alert('Escribe un destino');return}localStorageSafe('autostromDestination',s);window.Native?.navigate(s)}
function speakNext(){state.voice=!state.voice;if(state.route){const step=state.route.steps?.[state.routeStep];let phrase=step?instruction(step):'Ruta lista';$('musicHint').textContent=state.voice?'Indicaciones de voz activadas':'Indicaciones de voz desactivadas';if(state.voice)window.Native?.speak(phrase)}else{message('Primero selecciona una ruta.');openPanel('route')}}
function seekSong(percent){const d=state.media.duration;if(d>0)window.Native?.seekTo(Math.round(d*Number(percent)/100))}
function updateRouteSummary(){if(!$('routeSummary'))return;const r=state.route;if(!r){$('routeSummary').innerHTML='<span>Sin ruta cargada</span>';return}const d=(r.distance/1000).toFixed(1),t=Math.round(r.duration/60);$('routeSummary').innerHTML='<span><b>'+d+' km</b> · recorrido</span><span><b>'+t+' min</b> · estimación</span><span>Destino: '+escapeText(r.destination)+'</span>'}
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function instruction(s){const side={right:'derecha',left:'izquierda',straight:'recto',slight_right:'ligeramente a la derecha',slight_left:'ligeramente a la izquierda','uturn':'dar vuelta en U'}[s?.modifier]||'';const kind=s?.type||'';if(kind==='arrive')return 'Llegaste a tu destino';if(kind==='depart')return 'Sal por '+(s.road||'la vía actual');if(kind==='roundabout'||kind==='rotary')return 'Entra a la glorieta';return ((kind==='turn'||kind==='fork'||kind==='end of road')?'Gira ':'Continúa ')+(side||'recto')+(s.road?' · '+s.road:'')}
function distanceBetween(a,b){const r=6371000,lat=(a.lat-b.lat)*Math.PI/180,lon=(a.lon-b.lon)*Math.PI/180;const x=Math.sin(lat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(lon/2)**2;return r*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function updateGuidance(){if(!state.route||!state.location)return;const steps=state.route.steps||[];let idx=state.routeStep;while(idx<steps.length-1&&distanceBetween(state.location,steps[idx])<38)idx++;state.routeStep=idx;const step=steps[idx];if(step){const dist=distanceBetween(state.location,step);$('maneuver').textContent=(dist<1000?Math.round(dist/10)*10+' m':'A '+(dist/1000).toFixed(1)+' km');$('road').textContent=instruction(step)}else{$('maneuver').textContent='Ruta activa';$('road').textContent=state.route.destination;}}
window.AutoStrom={
 onSystem(s){$('batteryText').textContent=(s.battery<0?'--':s.battery)+'%';$('batteryFill').style.width=Math.max(0,s.battery)+'%';state.online=s.online;$('onlineDot').style.background=s.online?'#ff721c':'#666';$('conn').textContent=s.online?'EN LÍNEA':'SIN RED';},
 onMedia(m){state.media=m;$('title').textContent=m.title||'Sin reproducción';$('artist').textContent=m.artist||'Inicia una canción';$('playButton').textContent=m.playing?'Ⅱ':'▶';$('position').textContent=timeFmt(m.position);$('duration').textContent=timeFmt(m.duration);$('progress').value=m.duration>0?Math.round(m.position/m.duration*100):0;$('progress').disabled=!m.duration;if(m.art){if($('albumArt').src!==m.art)$('albumArt').src=m.art;$('albumArt').style.display='block';$('artFallback').style.display='none'}else{$('albumArt').style.display='none';$('artFallback').style.display='block'}if(m.permissionRequired)$('musicHint').textContent='Activa el permiso de música en Aplicaciones → Configuración';},
 onLocation(l){state.location=l;$('speed').textContent=(l.speed<0?'--':l.speed)+' km/h';$('locationHint').textContent=' · GPS '+(l.accuracy>0?Math.round(l.accuracy)+' m':'activo');$('gpsState').textContent='GPS ✓';if(!state.route){map.center={lat:l.lat,lon:l.lon};drawMap()}else{map.center={lat:l.lat,lon:l.lon};drawMap();updateGuidance()}},
 onApps(a){state.apps=a;if($('overlay').classList.contains('visible')&&$('overlayTitle').textContent==='Mis aplicaciones')renderApps()},
 onRoute(r){state.route=r;state.routeStep=0;map.fit(r.points);$('maneuver').textContent='Ruta calculada';$('road').textContent=r.destination;updateGuidance();updateRouteSummary();drawMap();},
 onRouteStatus(s){if($('routeStatus'))$('routeStatus').textContent=s.text;},
 onError(e){if($('routeStatus'))$('routeStatus').textContent=e.text;message(e.text)}
};
// Lightweight OpenStreetMap tile renderer. No remotely hosted JavaScript libraries.
const map={canvas:$('mapCanvas'),ctx:$('mapCanvas').getContext('2d'),center:{lat:20.69,lon:-99.82},zoom:13,cache:new Map(),frame:0,
