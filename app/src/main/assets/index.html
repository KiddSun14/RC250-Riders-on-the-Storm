<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no"><style>
:root{color-scheme:dark;--orange:#ff7019;--line:#35383c;--muted:#a5a8ae}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 90%,#25130d 0%,#0a0b0d 55%,#050506 100%);font:16px Arial,sans-serif;color:#f8f8f9;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}header{height:13vh;display:flex;align-items:center;justify-content:space-between;padding:0 3vw}#clock{font-size:clamp(24px,4vw,44px);font-weight:bold}#date{color:var(--muted);font-size:13px}#battery{font-size:18px}.layout{display:flex;gap:1.5vw;padding:0 1vw;height:84vh}.rail{width:8%;border:1px solid var(--line);border-radius:24px;background:#0c0c0ed9;display:flex;flex-direction:column;align-items:center;justify-content:space-around}.rail button{background:transparent;border:0;font-size:clamp(18px,3vw,32px);width:80%;height:17%;border-radius:18px}.rail button.active{border:2px solid var(--orange);box-shadow:0 0 18px #ff701966}.main{width:92%;display:grid;grid-template-columns:42% 1fr;grid-template-rows:1fr;gap:1.4vw}.panel{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#1c1d20d9,#080809ed);padding:2vw;min-width:0}.navigation{display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.navigation:before{content:"";position:absolute;inset:25% -15% -20%;opacity:.23;background:repeating-linear-gradient(22deg,transparent 0 42px,#555 44px 47px,transparent 49px 88px),repeating-linear-gradient(112deg,transparent 0 68px,#555 70px 73px,transparent 75px 125px);transform:perspective(240px) rotateX(28deg)}.navigation>*{position:relative}.small{color:var(--muted);font-size:14px}.heading{font-size:clamp(19px,2.5vw,30px);font-weight:700}.speed{font-size:clamp(65px,10vw,145px);font-weight:800;line-height:1}.speed span{font-size:16px;color:var(--orange)}.orange{color:var(--orange)}.right{display:grid;grid-template-rows:27% 1fr 15%;gap:1.4vw;min-height:0}.quick{display:flex;gap:1.4vw}.quick button{flex:1;border:1px solid var(--line);border-radius:22px;background:#1b1c1e;font-size:clamp(15px,2vw,26px)}.quick button:active,.action:active{border-color:var(--orange)}.music{display:flex;flex-direction:column;justify-content:space-between}.song{font-size:clamp(19px,2.4vw,34px);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artist{font-size:clamp(13px,1.7vw,23px);color:var(--muted);margin-top:10px}.controls{display:flex;gap:12px;justify-content:center}.controls button{background:#222327;border:1px solid #414247;border-radius:16px;padding:12px 24px;font-size:25px}.controls button:nth-child(2){border:2px solid var(--orange)}.foot{display:flex;align-items:center;justify-content:space-between;color:#aaa}.brand{font-size:clamp(20px,3vw,37px);font-weight:900;font-style:italic;color:white}.brand em{color:var(--orange);font-style:normal}.action{background:#18191b;border:1px solid var(--line);border-radius:15px;padding:12px 18px}.screen{display:none;position:absolute;left:11%;top:14%;width:87%;height:82%;background:#0b0c0ef7;border:1px solid #45474a;border-radius:25px;padding:25px;z-index:5;overflow:auto}.screen.visible{display:block}.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}.appgrid button{padding:18px 10px;border:1px solid #444;border-radius:14px;background:#1a1b1e;overflow:hidden;text-overflow:ellipsis}.topline{display:flex;align-items:center;justify-content:space-between}.topline button{border:1px solid #555;background:#191919;border-radius:10px;padding:10px 16px}@media(max-height:420px){.panel{padding:1.4vw}.controls button{padding:8px 18px}.right{grid-template-rows:25% 1fr 15%}}
</style></head><body><header><div><div id="clock">--:--</div><div id="date">RC250 · Riders on the Storm</div></div><div>◈ &nbsp; Wi-Fi &nbsp; ▂▄▆ &nbsp; <span id="battery">--%</span> ▣</div></header><div class="layout"><nav class="rail"><button class="active" onclick="home()">⌂</button><button onclick="go('maps')">➤</button><button onclick="musicSettings()">♫</button><button onclick="go('phone')">☎</button><button onclick="apps()">▦</button></nav><main class="main"><section class="panel navigation"><div><div class="small orange">NAVEGACIÓN Y CONDUCCIÓN</div><div class="heading" style="margin-top:12px">Cadereyta de Montes</div><p class="small" id="gps">Esperando ubicación GPS</p></div><div><div class="speed"><span id="speed">--</span><span> km/h</span></div><div class="small">Velocidad estimada por GPS</div></div><button class="action" onclick="go('maps')">➤ Abrir mapa y rutas</button></section><div class="right"><div class="quick"><button onclick="go('navigation')">➤ &nbsp; Ir a</button><button onclick="go('gps')">◎ &nbsp; GPS</button></div><section class="panel music"><div><div class="small orange">REPRODUCTOR MULTIMEDIA</div><div class="song" id="track" style="margin-top:16px">Sin reproducción</div><div class="artist" id="artist">Abre tu app de música</div></div><div class="controls"><button onclick="go('prev')">⏮</button><button id="play" onclick="go('play')">▶</button><button onclick="go('next')">⏭</button></div><button class="action" onclick="musicSettings()">♫ Activar control multimedia</button></section><div class="foot"><span>RC250 · LAUNCHER BETA</span><span class="brand">RC250<em>///</em></span></div></div></main></div><section id="screen" class="screen"><div class="topline"><strong id="screenTitle">Aplicaciones</strong><button onclick="home()">✕ Cerrar</button></div><div id="screenBody"></div></section><script>
function go(a){if(window.RC250)RC250.action(a)}function home(){document.getElementById('screen').classList.remove('visible')}function apps(){document.getElementById('screenTitle').textContent='Tus aplicaciones';document.getElementById('screen').classList.add('visible');go('apps')}function musicSettings(){document.getElementById('screenTitle').textContent='Configurar RC250';document.getElementById('screenBody').innerHTML='<p>Permite acceso a notificaciones para controlar la música que esté sonando.</p><button class="action" onclick="go(\'musicPermission\')">Activar controles musicales</button> <button class="action" onclick="go(\'homeSettings\')">Elegir launcher predeterminado</button> <button class="action" onclick="go(\'systemSettings\')">Ajustes de Android</button>';document.getElementById('screen').classList.add('visible')}
function setApps(arr){const grid=document.createElement('div');grid.className='appgrid';arr.forEach(a=>{const b=document.createElement('button');b.textContent=a.name;b.onclick=()=>{if(window.RC250)RC250.launch(a.pkg)};grid.appendChild(b)});document.getElementById('screenBody').replaceChildren(grid)}function setBattery(v){document.getElementById('battery').textContent=v}function setTrack(v){document.getElementById('track').textContent=v}function setArtist(v){document.getElementById('artist').textContent=v}function setPlaying(v){document.getElementById('play').textContent=v==='true'?'Ⅱ':'▶'}function setGps(v){document.getElementById('gps').textContent=v}function setSpeed(v){document.getElementById('speed').textContent=v}function updateClock(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'})}setInterval(updateClock,15000);updateClock();
</script></body></html>
